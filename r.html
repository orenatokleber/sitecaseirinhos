<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando... | Caseirinhos</title>
    <meta name="robots" content="noindex, nofollow">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #faf6ee;
            color: #2d231b;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .redirect-box {
            background: #fff;
            padding: 2.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 10px 30px rgba(45, 35, 27, 0.06);
            max-width: 400px;
            width: 90%;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #efe5d5;
            border-top: 3px solid #c3996b;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.25rem;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        h2 { font-size: 1.25rem; margin-bottom: 0.5rem; color: #2d231b; }
        p { font-size: 0.875rem; color: #8d7f72; margin-bottom: 1rem; }
        a { color: #c3996b; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body>
    <div class="redirect-box">
        <div class="spinner"></div>
        <h2>Redirecionando...</h2>
        <p id="redirectMsg">Aguarde um instante enquanto abrimos o seu link.</p>
        <a id="manualLink" href="/">Clique aqui se não for redirecionado</a>
    </div>

    <script src="assets/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            // Tenta extrair o slug de múltiplas fontes:
            // 1. Parâmetro ?slug= na query string
            // 2. Parâmetro ?l= na query string
            // 3. Hash #slug na URL
            // 4. Último segmento do path (para URLs limpas como /delivery)
            const pathSlug = window.location.pathname.replace(/^\//, '').replace(/\/$/, '').split('/').pop() || '';
            const rawSlug = urlParams.get('slug') || urlParams.get('l') || window.location.hash.replace('#', '') || pathSlug;
            const slug = (rawSlug || '').toLowerCase().trim();

            const DEFAULT_LINKS = {
                'whatsapp': 'https://wa.me/5511948598267?text=Ol%C3%A1!%20Vim%20pelo%20link%20do%20site%20da%20Caseirinhos.',
                'instagram': 'https://instagram.com/caseirinhosaconfeitaria',
                'delivery': 'https://instadelivery.com.br/caseirinhosaconfeitaria',
                'encomendas': '/montar-pedido',
                'cardapio': '/cardapio'
            };

            // Lê do localStorage se disponível
            let storedLinks = {};
            try {
                const stored = localStorage.getItem('caseirinhos_short_links');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    parsed.forEach(item => {
                        if (item.is_active !== false) {
                            storedLinks[item.slug.toLowerCase()] = item.target_url;
                        }
                    });
                }
            } catch(e) {}

            const targetUrl = storedLinks[slug] || DEFAULT_LINKS[slug] || '/';

            // Registra clique no localStorage
            try {
                const stored = localStorage.getItem('caseirinhos_short_links');
                if (stored) {
                    const parsed = JSON.parse(stored);
                    const linkObj = parsed.find(x => x.slug.toLowerCase() === slug);
                    if (linkObj) {
                        linkObj.clicks = (linkObj.clicks || 0) + 1;
                        localStorage.setItem('caseirinhos_short_links', JSON.stringify(parsed));
                    }
                }
            } catch(e) {}

            document.getElementById('manualLink').href = targetUrl;
            setTimeout(() => {
                window.location.replace(targetUrl);
            }, 300);
        });
    </script>
</body>
</html>
